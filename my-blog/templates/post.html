<article class="post">
  <header class="post-header">
    <h1>{{ title }}</h1>
    <p class="post-meta">
      <time datetime="{{ isoDate }}">{{ dateFormatted }}</time> · {{ readingTime }}
    </p>
  </header>

  {{#if featuredImage}}
  <figure class="featured-image">
    <img src="{{ featuredImage }}" alt="{{ featuredImageAlt }}">
  </figure>
  {{/if}}

  <div class="post-content">
    {{ content }}
  </div>

  <footer class="post-footer">
    <a href="/">← All posts</a>
  </footer>
</article>
